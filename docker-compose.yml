services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: sqlite:////app/storage/app.db
      SCHEDULER_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-docker-dev-jwt-secret-change-me-32b}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-docker-dev-token-encryption-key}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@yottolabs.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-12345}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000
    volumes:
      - agent-storage:/app/storage
      - agent-tmp:/app/tmp
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  agent-storage:
  agent-tmp:
