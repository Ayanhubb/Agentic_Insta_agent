<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instagram Image Posting Agent</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111;
      --muted: #555;
      --line: #ddd;
      --ok: #0a7a32;
      --wait: #888;
      --fail: #b00020;
    }
    body {
      font-family: Georgia, "Times New Roman", serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px 48px;
      color: var(--ink);
      background: #fff;
    }
    h1 { font-size: 1.6rem; font-weight: normal; margin: 0 0 24px; }
    h2 { font-size: 1.1rem; font-weight: normal; margin: 28px 0 12px; }
    button, input[type="file"] { font: inherit; }
    button {
      padding: 8px 14px;
      cursor: pointer;
    }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    .preview {
      margin: 16px 0;
      min-height: 48px;
      color: var(--muted);
    }
    .preview img {
      max-width: 100%;
      max-height: 320px;
      display: block;
      border: 1px solid var(--line);
    }
    .row { margin: 12px 0; }
    #steps { list-style: none; padding: 0; margin: 0; }
    #steps li { margin: 6px 0; color: var(--wait); }
    #steps li.success { color: var(--ok); }
    #steps li.failed { color: var(--fail); }
    #steps li.running { color: var(--ink); }
    #result { margin-top: 16px; white-space: pre-wrap; }
    .error { color: var(--fail); }
  </style>
</head>
<body>
  <h1>Instagram Image Posting Agent</h1>

  <div class="row">
    <label>Upload Image
      <input id="file" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" />
    </label>
  </div>

  <div class="preview" id="preview">No image selected</div>

  <div class="row">
    <button id="publish" type="button">Publish to Instagram</button>
  </div>

  <h2>Agent Execution</h2>
  <ul id="steps">
    <li data-tool="validate_image">Image validated</li>
    <li data-tool="prepare_image">Image prepared</li>
    <li data-tool="upload_image">Image uploaded</li>
    <li data-tool="create_instagram_media">Instagram media created</li>
    <li data-tool="publish_instagram_media">Instagram media published</li>
    <li data-tool="verify_publication">Publication verified</li>
  </ul>

  <div id="result"></div>

  <script>
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("preview");
    const publish = document.getElementById("publish");
    const result = document.getElementById("result");
    const stepItems = [...document.querySelectorAll("#steps li")];
    let selectedFile = null;
    let eventSource = null;

    const labels = {
      validate_image: "Image validated",
      prepare_image: "Image prepared",
      upload_image: "Image uploaded",
      create_instagram_media: "Instagram media created",
      publish_instagram_media: "Instagram media published",
      verify_publication: "Publication verified",
    };

    fileInput.addEventListener("change", () => {
      selectedFile = fileInput.files[0] || null;
      if (!selectedFile) {
        preview.textContent = "No image selected";
        return;
      }
      const url = URL.createObjectURL(selectedFile);
      preview.innerHTML = "";
      const img = document.createElement("img");
      img.src = url;
      img.alt = "Selected image preview";
      preview.appendChild(img);
    });

    function resetSteps() {
      stepItems.forEach((item) => {
        item.className = "";
        item.textContent = labels[item.dataset.tool];
      });
    }

    function render(payload) {
      const byTool = {};
      (payload.steps || []).forEach((step) => { byTool[step.tool] = step; });
      stepItems.forEach((item) => {
        const step = byTool[item.dataset.tool];
        const status = step ? step.status : "pending";
        item.className = status;
        if (status === "success") {
          item.textContent = "✓ " + labels[item.dataset.tool];
        } else if (status === "running") {
          item.textContent = "… " + labels[item.dataset.tool];
        } else if (status === "failed") {
          item.textContent = "✗ " + labels[item.dataset.tool];
        } else if (status === "skipped") {
          item.textContent = "– " + labels[item.dataset.tool];
        } else {
          item.textContent = labels[item.dataset.tool];
        }
      });

      if (payload.status === "completed" && payload.instagram_media_id) {
        result.className = "";
        result.textContent = "Result:\nInstagram Media ID: " + payload.instagram_media_id;
      } else if (payload.status === "failed") {
        result.className = "error";
        const message = payload.error && payload.error.message ? payload.error.message : "Publishing failed";
        const code = payload.error && payload.error.code ? payload.error.code : "";
        result.textContent = "Result:\nFailed" + (code ? " (" + code + ")" : "") + "\n" + message;
      }
    }

    function watch(taskId) {
      if (eventSource) {
        eventSource.close();
      }
      eventSource = new EventSource("/api/v1/tasks/" + taskId + "/events");
      eventSource.addEventListener("status", (event) => {
        const payload = JSON.parse(event.data);
        render(payload);
        if (payload.status === "completed" || payload.status === "failed") {
          eventSource.close();
          publish.disabled = false;
        }
      });
      eventSource.onerror = async () => {
        eventSource.close();
        const response = await fetch("/api/v1/tasks/" + taskId);
        if (response.ok) {
          render(await response.json());
        }
        publish.disabled = false;
      };
    }

    publish.addEventListener("click", async () => {
      if (!selectedFile) {
        result.className = "error";
        result.textContent = "Choose a JPEG or PNG image first.";
        return;
      }
      publish.disabled = true;
      result.className = "";
      result.textContent = "Starting Agent…";
      resetSteps();
      const body = new FormData();
      body.append("image", selectedFile);
      try {
        const response = await fetch("/api/v1/instagram/publish", {
          method: "POST",
          body,
        });
        const payload = await response.json();
        if (!payload.task_id) {
          result.className = "error";
          result.textContent = (payload.error && payload.error.message) || "Request failed";
          publish.disabled = false;
          return;
        }
        render(payload);
        watch(payload.task_id);
      } catch (error) {
        result.className = "error";
        result.textContent = "Could not reach the Agent API.";
        publish.disabled = false;
      }
    });
  </script>
</body>
</html>
