[pytest]
pythonpath = .
testpaths = tests
addopts = -q -m "not real_openai and not real_deepseek"
asyncio_mode = auto
markers =
    integration: optional tests that require Meta credentials
    real_instagram: optional tests that require Meta credentials
    real_openai: optional tests that perform real OpenAI API calls; never part of default pytest
    real_deepseek: optional tests that perform real DeepSeek API calls; never part of default pytest
filterwarnings =
    ignore::DeprecationWarning
